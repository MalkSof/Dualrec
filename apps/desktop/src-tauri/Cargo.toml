[package]
name = "dualrec"
version = "0.1.3"
description = "Grabador de pantalla y cámara en pistas separadas"
authors = ["MalkaDigital"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
chrono = "0.4"
dirs = "6"
windows-capture = "2.0.1"
nokhwa = { version = "0.10.11", features = ["input-native"] }
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ureq = { version = "2", features = ["json"] }
arboard = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
