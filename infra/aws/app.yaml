AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Dualrec - aplicacion completa en AWS: videos en S3, base de datos en RDS
  PostgreSQL, API en ECS Fargate y CloudFront sirviendo la web y la API con
  HTTPS bajo un mismo dominio.

Parameters:
  ImageUri:
    Type: String
    Description: Imagen de la API en ECR (la arma el proyecto de CodeBuild de build.yaml).
  CloudFrontPrefixListId:
    Type: String
    Description: >-
      Id de la lista de prefijos administrada com.amazonaws.global.cloudfront.origin-facing
      en esta region. Con ella el balanceador solo acepta trafico que viene de CloudFront.
    AllowedPattern: ^pl-[0-9a-f]+$
  AdminEmail:
    Type: String
    Description: Correo del primer usuario.
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
  AdminName:
    Type: String
    Default: Admin
    Description: Nombre del primer usuario (aparece como autor en los links compartidos).
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DatabaseStorageGb:
    Type: Number
    Default: 20
    MinValue: 20
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]
  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "4096", "8192"]

Resources:
  # ---------------------------------------------------------------- Red
  # Dos subredes publicas en zonas distintas. No hay NAT (cuesta mas que todo
  # lo demas junto): las tareas salen a internet con IP publica y solo aceptan
  # trafico del balanceador; la base no es publica.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: dualrec

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: dualrec-a

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: dualrec-b

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Balanceador de Dualrec - solo CloudFront
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API de Dualrec - solo el balanceador
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: Balanceador

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Base de Dualrec - solo la API
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: API

  # ---------------------------------------------------------------- Almacenamiento
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          # La app sube las partes y el reproductor web lee por rangos, siempre
          # con URLs prefirmadas de corta duracion.
          - AllowedMethods: [GET, HEAD, PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag, Content-Length, Content-Range]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          # Subidas que nunca se cerraron (grabaciones abandonadas) dejan de ocupar lugar.
          - Id: AbortarSubidasIncompletas
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 14

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------------------------------------------------------- Base de datos
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes de la base de Dualrec
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "17.6"
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseStorageGb
      StorageType: gp3
      StorageEncrypted: true
      DBName: dualrec
      MasterUsername: dualrec
      # La contrasena la genera y la guarda RDS en Secrets Manager.
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      DeletionProtection: true

  # ---------------------------------------------------------------- Usuario inicial
  AdminTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Token de acceso del primer usuario de Dualrec
      GenerateSecretString:
        PasswordLength: 43
        ExcludePunctuation: true

  # ---------------------------------------------------------------- API (ECS Fargate)
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: dualrec

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /dualrec/api
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: secretos
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref AdminTokenSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: videos
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub ${MediaBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt MediaBucket.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: dualrec-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      # Lugar en disco para reempaquetar videos largos (se baja y se vuelve a subir cada pista).
      EphemeralStorage:
        SizeInGiB: 60
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: DUALREC_DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DUALREC_DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DUALREC_DB_NAME
              Value: dualrec
            - Name: DUALREC_DB_USER
              Value: dualrec
            - Name: DUALREC_S3_BUCKET
              Value: !Ref MediaBucket
            - Name: DUALREC_S3_REGION
              Value: !Ref AWS::Region
            - Name: DUALREC_PUBLIC_WEB_URL
              Value: !Sub https://${Distribution.DomainName}
            - Name: DUALREC_CORS_ORIGINS
              Value: !Sub https://${Distribution.DomainName}
            - Name: DUALREC_API_PREFIX
              Value: /api
            - Name: DUALREC_BOOTSTRAP_EMAIL
              Value: !Ref AdminEmail
            - Name: DUALREC_BOOTSTRAP_NAME
              Value: !Ref AdminName
          Secrets:
            - Name: DUALREC_DB_PASSWORD
              ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::"
            - Name: DUALREC_BOOTSTRAP_TOKEN
              ValueFrom: !Ref AdminTokenSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref SubnetA
        - !Ref SubnetB
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 4
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: dualrec-api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref SubnetA
            - !Ref SubnetB
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------- CloudFront
  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub dualrec-web-${AWS::Region}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # La web es una SPA: cualquier ruta sin extension (por ejemplo /v/abc) se
  # resuelve con index.html y la app decide que mostrar.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub dualrec-spa-${AWS::Region}
      AutoPublish: true
      FunctionConfig:
        Comment: Rutas de la SPA a index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.substring(request.uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Dualrec
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          # Politica administrada CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            # Politicas administradas CachingDisabled y AllViewerExceptHostHeader:
            # nada de la API se guarda en cache y el token llega intacto.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  Url:
    Description: Direccion de la web (biblioteca y links para compartir).
    Value: !Sub https://${Distribution.DomainName}
  ApiUrl:
    Description: Direccion para cargar en la app de escritorio (Ajustes - Nube).
    Value: !Sub https://${Distribution.DomainName}/api
  AdminTokenSecretArn:
    Description: Secreto con el token de acceso del primer usuario.
    Value: !Ref AdminTokenSecret
  WebBucket:
    Value: !Ref WebBucket
  MediaBucket:
    Value: !Ref MediaBucket
  DistributionId:
    Value: !Ref Distribution
  Cluster:
    Value: !Ref Cluster
  Service:
    Value: !GetAtt Service.Name
